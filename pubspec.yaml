name: filevault
description: My Notes - buttons, notes, files, camera and backup in one app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  archive: ^3.6.1
  permission_handler: ^11.3.1
  path: ^1.9.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
